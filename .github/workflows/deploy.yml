name: Deploy para CloudPanel (Node.js + MySQL)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Instalar Dependências
        run: npm install

      - name: 4. Gerar Build de Produção
        run: npm run build

      - name: 5. Preparar Pacote de Deploy
        run: |
          mkdir -p deploy_pkg
          cp -r dist deploy_pkg/dist
          cp server.js deploy_pkg/server.js
          cp package.json deploy_pkg/package.json
          cp package-lock.json deploy_pkg/package-lock.json 2>/dev/null || :

      - name: 6. Sincronizar Arquivos com o CloudPanel (via SSH / Rsync)
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CLOUDPANEL_SSH_KEY }}
          ARGS: "-rltgoDzvO"
          SOURCE: "deploy_pkg/"
          REMOTE_HOST: ${{ secrets.CLOUDPANEL_HOST }}
          REMOTE_USER: ${{ secrets.CLOUDPANEL_SSH_USER || 'popsssh' }}
          TARGET: "/home/${{ secrets.CLOUDPANEL_SITE_USER || 'pops' }}/htdocs/${{ secrets.CLOUDPANEL_SITE || 'pops.moveisrufato.com.br' }}/"
          SCRIPT_AFTER: |
            cd /home/${{ secrets.CLOUDPANEL_SITE_USER || 'pops' }}/htdocs/${{ secrets.CLOUDPANEL_SITE || 'pops.moveisrufato.com.br' }}/
            pkill -9 -f 'node.*server.js' || fuser -k -9 3031/tcp || true
            sleep 2
            nohup /home/pops/.nvm/versions/node/v24.21.0/bin/node server.js > app.log 2>&1 &
            sleep 2
            cat app.log
